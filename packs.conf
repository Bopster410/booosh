# Where `./pack add NAME` looks for a pack that is not shipped in this repository (a "catalog": one folder per pack).
# github:OWNER/REPO[@REF] or a local folder. A branch or tag can move; a full commit hash (40 hex digits) cannot:
# pin it for reproducible installs, for example CATALOG=github:Bopster410/booosh-packs@<commit>
CATALOG=github:Bopster410/booosh-packs@main
