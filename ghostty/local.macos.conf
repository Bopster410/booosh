# macOS overrides (per machine; untested: written from the docs, not run on a Mac)
# Without this, Option+key types special characters and every alt+ bind is dead.
macos-option-as-alt = true

# Uncomment if fish is not your login shell (Homebrew path on Apple Silicon):
# command = /opt/homebrew/bin/fish
# shell-integration = fish

# Heavier font strokes (Ghostty only supports this on macOS):
# font-thicken = true
