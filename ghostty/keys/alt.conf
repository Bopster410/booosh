# ─── keys: @MOD@ layout ───────────────────────────────────
# @MOD@+arrows           → new split in that direction
keybind = @MOD@+up=new_split:up
keybind = @MOD@+down=new_split:down
keybind = @MOD@+left=new_split:left
keybind = @MOD@+right=new_split:right
# @MOD@+shift+arrows     → focus split
keybind = @MOD@+shift+up=goto_split:up
keybind = @MOD@+shift+down=goto_split:down
keybind = @MOD@+shift+left=goto_split:left
keybind = @MOD@+shift+right=goto_split:right
# @MOD@+r, then arrow    → resize split
keybind = @MOD@+key_r>up=resize_split:up,40
keybind = @MOD@+key_r>down=resize_split:down,40
keybind = @MOD@+key_r>left=resize_split:left,40
keybind = @MOD@+key_r>right=resize_split:right,40
keybind = @MOD@+key_z=toggle_split_zoom
keybind = @MOD@+key_e=equalize_splits
# tabs (letters are physical keys, so they work on any layout)
keybind = @MOD@+key_t=new_tab
keybind = @MOD@+key_w=close_surface
keybind = @MOD@+bracket_left=previous_tab
keybind = @MOD@+bracket_right=next_tab
keybind = @MOD@+shift+bracket_left=move_tab:-1
keybind = @MOD@+shift+bracket_right=move_tab:1
# prompt jump / misc
keybind = @MOD@+page_up=jump_to_prompt:-1
keybind = @MOD@+page_down=jump_to_prompt:1
keybind = ctrl+shift+key_p=toggle_command_palette
keybind = ctrl+shift+key_r=reload_config
